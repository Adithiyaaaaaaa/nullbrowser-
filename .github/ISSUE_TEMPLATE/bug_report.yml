name: Bug report
description: Report reproducible incorrect behavior in NullBrowser
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include browsing data, credentials, tokens, or exploitable security details. Use the Security tab for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: NullBrowser version or commit
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device/emulator
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Use a public, non-sensitive example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
