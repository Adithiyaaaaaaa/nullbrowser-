name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            grep -E 'issues were found|Dependency .+ requires|currently compiled|Recommended action|compileSdk|minSdk|AAR metadata|Execution failed|What went wrong' gradle-build.log \
              | head -n 45 \
              | sed 's/%/%25/g; s/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error title=Gradle output::$line"; done
            exit "$build_status"
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nullbrowser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
