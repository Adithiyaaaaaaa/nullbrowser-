<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">NullBrowser mobile UI mockup</title>
  <desc id="desc">A polished mobile browser UI with a dark glass home page, N mark, Harsha Search, bottom controls, and privacy tools.</desc>
  <defs>
    <radialGradient id="glow" cx="70%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity=".44"/>
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18263d" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#090f1d" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="nmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="#050816"/>
  <rect width="1400" height="900" fill="url(#glow)"/>
  <g opacity=".15" stroke="#7dd3fc">
    <path d="M0 720h1400M0 650h1400M0 580h1400M0 510h1400M0 440h1400"/>
    <path d="M140 360v540M300 320v580M460 280v620M620 240v660M780 240v660M940 280v620M1100 320v580M1260 360v540"/>
  </g>
  <rect x="438" y="60" width="524" height="780" rx="54" fill="#0b1220" stroke="#334155" stroke-width="4"/>
  <rect x="466" y="92" width="468" height="716" rx="36" fill="#07101f"/>
  <rect x="492" y="118" width="416" height="438" rx="32" fill="url(#panel)" stroke="#3b82f6" stroke-opacity=".28"/>
  <rect x="650" y="160" width="100" height="100" rx="30" fill="url(#nmark)"/>
  <text x="700" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#f8fafc">N</text>
  <text x="700" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fafc">NullBrowser</text>
  <text x="700" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#b7cce5">Harsha Search. Local answers first.</text>
  <rect x="538" y="396" width="324" height="58" rx="22" fill="#18263c" stroke="#5b7da8"/>
  <text x="700" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#94a3b8">Search privately or enter a URL</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#dbeafe">
    <rect x="538" y="482" width="152" height="44" rx="18" fill="#0f1b2f" stroke="#29476d"/>
    <text x="614" y="510" text-anchor="middle">settings</text>
    <rect x="710" y="482" width="152" height="44" rx="18" fill="#0f1b2f" stroke="#29476d"/>
    <text x="786" y="510" text-anchor="middle">stats</text>
  </g>
  <rect x="492" y="584" width="416" height="178" rx="32" fill="#0e1726" stroke="#334155"/>
  <rect x="520" y="612" width="360" height="52" rx="22" fill="#18263c" stroke="#47688f"/>
  <text x="542" y="645" font-family="Arial, sans-serif" font-size="19" fill="#e2e8f0">Harsha Search or URL</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="520" y="682" width="80" height="42" rx="16" fill="#18263c" stroke="#2d4666"/>
    <text x="560" y="708" text-anchor="middle" fill="#f8fafc">Back</text>
    <rect x="612" y="682" width="80" height="42" rx="16" fill="#18263c" stroke="#2d4666"/>
    <text x="652" y="708" text-anchor="middle" fill="#f8fafc">Next</text>
    <rect x="704" y="682" width="80" height="42" rx="16" fill="#18263c" stroke="#2d4666"/>
    <text x="744" y="708" text-anchor="middle" fill="#7dd3fc">N</text>
    <rect x="796" y="682" width="84" height="42" rx="16" fill="#18263c" stroke="#2d4666"/>
    <text x="838" y="708" text-anchor="middle" fill="#f8fafc">Refresh</text>
  </g>
</svg>
